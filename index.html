```html
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #080808;
}

#bomb {
    position: absolute;
    left: 50%;
    top: -100px;
    width: 80px;
    height: 80px;
    margin-left: -40px;
    background: #222;
    border: 5px solid #555;
    border-radius: 50%;
    box-shadow: inset -12px -12px 15px #000,
                8px 12px 20px #000;
    z-index: 5;
}

#bomb:before {
    content: "";
    position: absolute;
    width: 20px;
    height: 25px;
    background: #333;
    left: 25px;
    top: -25px;
    border-radius: 5px;
}

#fuse {
    position: absolute;
    width: 25px;
    height: 5px;
    background: #8b4513;
    left: 42px;
    top: -28px;
    transform: rotate(-35deg);
}

#spark {
    position: absolute;
    left: 64px;
    top: -38px;
    width: 10px;
    height: 10px;
    background: #ffcc00;
    border-radius: 50%;
    box-shadow: 0 0 15px 8px #ff6600;
}

#boom {
    display: none;
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    font-size: 150px;
    z-index: 20;
}

#message {
    display: none;
    position: absolute;
    width: 100%;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    text-align: center;
    color: white;
    font-family: Arial, sans-serif;
    font-size: clamp(30px, 6vw, 65px);
    font-weight: bold;
    z-index: 30;
}

@keyframes fall {
    0% {
        top: -100px;
        transform: rotate(0deg);
    }

    70% {
        top: calc(100vh - 180px);
        transform: rotate(300deg);
    }

    82% {
        top: calc(100vh - 110px);
        transform: rotate(350deg) scale(1.1);
    }

    90% {
        top: calc(100vh - 150px);
        transform: rotate(380deg) scale(.95);
    }

    100% {
        top: calc(100vh - 125px);
        transform: rotate(400deg);
    }
}

@keyframes boom {
    0% {
        transform: translate(-50%, -50%) scale(.1);
        opacity: 0;
    }

    25% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
    }

    100% {
        transform: translate(-50%, -50%) scale(2.5);
        opacity: 0;
    }
}

@keyframes shake {
    0% { transform: translate(0,0); }
    20% { transform: translate(-12px,8px); }
    40% { transform: translate(12px,-8px); }
    60% { transform: translate(-8px,-5px); }
    80% { transform: translate(8px,5px); }
    100% { transform: translate(0,0); }
}

.shake {
    animation: shake .4s;
}
</style>
</head>

<body>

<div id="bomb">
    <div id="fuse"></div>
    <div id="spark"></div>
</div>

<div id="boom">💥</div>

<div id="message">
    naz elinden düşürdü prdn
</div>

<script>

const bomb = document.getElementById("bomb");
const boom = document.getElementById("boom");
const message = document.getElementById("message");


/* BOMBA DÜŞÜYOR */
setTimeout(function() {
    bomb.style.animation = "fall 1.4s ease-in forwards";
}, 200);


/* PATLAMA */
setTimeout(function() {

    bomb.style.display = "none";

    boom.style.display = "block";
    boom.style.animation = "boom .6s ease-out forwards";

    document.body.classList.add("shake");

    /* YAZI */
    setTimeout(function() {
        message.style.display = "block";
    }, 250);

}, 1650);


/*
   PATLAMA SESİ
   Tarayıcı izin verirse otomatik çalar.
*/

function sound() {

    try {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        const ctx = new AudioContext();

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = "sawtooth";

        osc.frequency.setValueAtTime(
            100,
            ctx.currentTime
        );

        osc.frequency.exponentialRampToValueAtTime(
            25,
            ctx.currentTime + .5
        );

        gain.gain.setValueAtTime(
            .8,
            ctx.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .01,
            ctx.currentTime + .5
        );

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        osc.stop(ctx.currentTime + .5);

    } catch(e) {}

}


/* Patlama ile aynı anda ses */
setTimeout(sound, 1650);

</script>

</body>
</html>
