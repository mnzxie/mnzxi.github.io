```html
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Naz</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Ana yazı */
        #message {
            opacity: 0;
            transform: scale(0.5);
            font-size: clamp(28px, 6vw, 70px);
            font-weight: bold;
            text-align: center;
            transition: opacity 0.5s ease, transform 0.5s ease;
            padding: 20px;
        }

        #message.show {
            opacity: 1;
            transform: scale(1);
        }

        /* Bomba */
        #bomb {
            position: fixed;
            top: -120px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 90px;
            z-index: 10;
            user-select: none;
        }

        /* Patlama */
        #explosion {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 180px;
            opacity: 0;
            z-index: 20;
            user-select: none;
        }

        #explosion.explode {
            animation: explosion 0.7s ease-out forwards;
        }

        @keyframes explosion {
            0% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 0;
            }

            30% {
                transform: translate(-50%, -50%) scale(1.5);
                opacity: 1;
            }

            100% {
                transform: translate(-50%, -50%) scale(3);
                opacity: 0;
            }
        }

        /* Bombanın düşmesi */
        #bomb.drop {
            animation: drop 1.4s cubic-bezier(.2,.8,.3,1) forwards;
        }

        @keyframes drop {
            0% {
                top: -120px;
            }

            75% {
                top: calc(100vh - 130px);
            }

            85% {
                top: calc(100vh - 160px);
            }

            92% {
                top: calc(100vh - 130px);
            }

            100% {
                top: calc(100vh - 140px);
            }
        }

        /* Patlama sırasında ekran */
        body.shake {
            animation: shake 0.45s ease;
        }

        @keyframes shake {
            0%   { transform: translate(0, 0); }
            15%  { transform: translate(-12px, 8px); }
            30%  { transform: translate(10px, -8px); }
            45%  { transform: translate(-8px, -10px); }
            60%  { transform: translate(10px, 7px); }
            75%  { transform: translate(-6px, 4px); }
            100% { transform: translate(0, 0); }
        }

        /* Ekrandaki beyaz patlama */
        #flash {
            position: fixed;
            inset: 0;
            background: white;
            opacity: 0;
            pointer-events: none;
            z-index: 30;
        }

        #flash.flash {
            animation: flash 0.25s ease-out;
        }

        @keyframes flash {
            0% {
                opacity: 0.9;
            }

            100% {
                opacity: 0;
            }
        }

        /* Küçük açıklama */
        #sub {
            position: fixed;
            bottom: 25px;
            left: 0;
            right: 0;
            text-align: center;
            color: #555;
            font-size: 13px;
            opacity: 0;
            transition: opacity 1s ease;
        }

        #sub.show {
            opacity: 1;
        }
    </style>
</head>

<body>

    <div id="bomb">💣</div>

    <div id="explosion">💥</div>

    <div id="flash"></div>

    <div id="message">
        naz elinden düşürdü prdn
    </div>

    <div id="sub">
        site normal çalışıyor 👍
    </div>


    <script>

        /*
            BASLANGIÇ
            Sayfa açıldığında bomba düşer.
        */

        const bomb = document.getElementById("bomb");
        const explosion = document.getElementById("explosion");
        const flash = document.getElementById("flash");
        const message = document.getElementById("message");
        const sub = document.getElementById("sub");


        /*
            PATLAMA SESİ

            Harici MP3 kullanmıyoruz.
            Tarayıcının kendi ses sisteminden
            kısa bir patlama benzeri ses oluşturuyoruz.
        */

        function makeExplosionSound() {

            try {

                const AudioContext =
                    window.AudioContext ||
                    window.webkitAudioContext;

                const audioContext = new AudioContext();

                const duration = 0.45;

                const buffer =
                    audioContext.createBuffer(
                        1,
                        audioContext.sampleRate * duration,
                        audioContext.sampleRate
                    );

                const data =
                    buffer.getChannelData(0);

                /*
                    Gürültü oluşturuyoruz.
                */

                for (let i = 0; i < data.length; i++) {

                    const decay =
                        1 - i / data.length;

                    data[i] =
                        (Math.random() * 2 - 1)
                        * decay
                        * decay;

                }

                const noise =
                    audioContext.createBufferSource();

                noise.buffer = buffer;


                /*
                    Bas frekans
                */

                const oscillator =
                    audioContext.createOscillator();

                oscillator.type = "sine";
                oscillator.frequency.setValueAtTime(
                    100,
                    audioContext.currentTime
                );

                oscillator.frequency.exponentialRampToValueAtTime(
                    35,
                    audioContext.currentTime + 0.35
                );


                /*
                    Ses seviyeleri
                */

                const noiseGain =
                    audioContext.createGain();

                const oscillatorGain =
                    audioContext.createGain();

                noiseGain.gain.setValueAtTime(
                    0.8,
                    audioContext.currentTime
                );

                noiseGain.gain.exponentialRampToValueAtTime(
                    0.01,
                    audioContext.currentTime + duration
                );

                oscillatorGain.gain.setValueAtTime(
                    0.8,
                    audioContext.currentTime
                );

                oscillatorGain.gain.exponentialRampToValueAtTime(
                    0.01,
                    audioContext.currentTime + 0.35
                );


                noise.connect(noiseGain);
                noiseGain.connect(audioContext.destination);

                oscillator.connect(oscillatorGain);
                oscillatorGain.connect(audioContext.destination);


                noise.start();

                oscillator.start();

                noise.stop(
                    audioContext.currentTime + duration
                );

                oscillator.stop(
                    audioContext.currentTime + 0.35
                );

            } catch (error) {

                console.log(
                    "Ses otomatik olarak başlatılamadı."
                );

            }
        }


        /*
            PATLAMA
        */

        function explode() {

            // Bomba kaybolsun
            bomb.style.display = "none";

            // Patlama
            explosion.classList.add("explode");

            // Ekran parlaması
            flash.classList.add("flash");

            // Ekran sarsılması
            document.body.classList.add("shake");

            // Ses
            makeExplosionSound();


            /*
                Patlamadan biraz sonra yazı gelsin.
            */

            setTimeout(() => {

                message.classList.add("show");

            }, 350);


            /*
                Alt yazı
            */

            setTimeout(() => {

                sub.classList.add("show");

            }, 1200);

        }


        /*
            SAYFA AÇILDIĞINDA
        */

        window.addEventListener("load", () => {

            /*
                Küçük gecikme:
                Kullanıcı sayfayı açtığında
                bomba hemen düşmeye başlasın.
            */

            setTimeout(() => {

                bomb.classList.add("drop");

            }, 150);


            /*
                Bomba düştükten sonra patla.
            */

            setTimeout(() => {

                explode();

            }, 1550);

        });


        /*
            TARAYICI SESİ ENGELLERSE

            Kullanıcı sayfaya herhangi bir şekilde
            tıklarsa ses yine çalışabilir.
        */

        document.addEventListener(
            "click",
            () => {

                if (
                    !document.body.dataset.soundStarted
                ) {

                    document.body.dataset.soundStarted =
                        "true";

                }

            },
            { once: true }
        );

    </script>

</body>
</html>
