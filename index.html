<head>

<title></title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #080808;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
}

/* BOMBA */
#bomb {
    position: fixed;
    left: 50%;
    top: -100px;
    transform: translateX(-50%) rotate(-15deg);
    font-size: 85px;
    z-index: 10;
    user-select: none;
}

/* DÜŞME */
#bomb.drop {
    animation: falling 1.35s cubic-bezier(.45,.05,.55,.95) forwards;
}

@keyframes falling {

    0% {
        top: -110px;
        transform: translateX(-50%) rotate(-15deg);
    }

    20% {
        transform: translateX(-50%) rotate(25deg);
    }

    45% {
        transform: translateX(-50%) rotate(-30deg);
    }

    70% {
        transform: translateX(-50%) rotate(35deg);
    }

    88% {
        top: calc(100vh - 145px);
        transform: translateX(-50%) rotate(-20deg);
    }

    /* YERE ÇARPIYOR */
    92% {
        top: calc(100vh - 115px);
        transform: translateX(-50%) rotate(10deg) scale(1.08);
    }

    /* SEKİYOR */
    96% {
        top: calc(100vh - 145px);
        transform: translateX(-50%) rotate(-8deg) scale(.95);
    }

    /* YERE OTURUYOR */
    100% {
        top: calc(100vh - 125px);
        transform: translateX(-50%) rotate(0deg) scale(1);
    }
}


/* KÜÇÜK ÇARPMA TOZU */
#dust {
    position: fixed;
    left: 50%;
    bottom: 70px;
    transform: translateX(-50%) scale(0);
    font-size: 70px;
    opacity: 0;
    z-index: 8;
}

#dust.show {
    animation: dust 0.35s ease-out forwards;
}

@keyframes dust {

    0% {
        transform: translateX(-50%) scale(.2);
        opacity: 0;
    }

    40% {
        transform: translateX(-50%) scale(1);
        opacity: .8;
    }

    100% {
        transform: translateX(-50%) scale(1.5);
        opacity: 0;
    }
}


/* PATLAMA */
#explosion {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-size: 170px;
    opacity: 0;
    z-index: 20;
}

#explosion.show {
    animation: boom .65s ease-out forwards;
}

@keyframes boom {

    0% {
        transform: translate(-50%, -50%) scale(0);
        opacity: 0;
    }

    20% {
        transform: translate(-50%, -50%) scale(.8);
        opacity: 1;
    }

    50% {
        transform: translate(-50%, -50%) scale(1.5);
        opacity: 1;
    }

    100% {
        transform: translate(-50%, -50%) scale(3);
        opacity: 0;
    }
}


/* EKRAN PARLAMASI */
#flash {
    position: fixed;
    inset: 0;
    background: white;
    opacity: 0;
    z-index: 30;
    pointer-events: none;
}

#flash.show {
    animation: flash .18s ease-out;
}

@keyframes flash {

    0% {
        opacity: .95;
    }

    100% {
        opacity: 0;
    }
}


/* EKRAN SARSINTISI */
body.shake {
    animation: shake .45s ease;
}

@keyframes shake {

    0%   { transform: translate(0,0); }
    15%  { transform: translate(-15px,8px); }
    30%  { transform: translate(14px,-10px); }
    45%  { transform: translate(-10px,-8px); }
    60%  { transform: translate(12px,10px); }
    75%  { transform: translate(-6px,-5px); }
    100% { transform: translate(0,0); }

}


/* YAZI */
#message {
    position: fixed;
    left: 0;
    right: 0;
    top: 50%;
    transform: translateY(-50%) scale(.6);

    text-align: center;

    color: white;

    font-size: clamp(28px, 6vw, 65px);
    font-weight: 700;

    opacity: 0;

    z-index: 40;

    padding: 20px;
}

#message.show {
    animation: messageIn .35s ease-out forwards;
}

@keyframes messageIn {

    from {
        opacity: 0;
        transform: translateY(-50%) scale(.6);
    }

    to {
        opacity: 1;
        transform: translateY(-50%) scale(1);
    }

}
</style>
</head>

<body>
