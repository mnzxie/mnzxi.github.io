<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>...</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      cursor: default;
    }

    #screen {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    #warning {
      color: #111;
      font-family: monospace;
      font-size: 12px;
      position: absolute;
      bottom: 15px;
      left: 15px;
      opacity: 0.15;
    }

    #jumpscare {
      position: fixed;
      inset: 0;
      background: #000;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    #face {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      filter: contrast(1.4) brightness(0.9);
    }

    #flash {
      position: fixed;
      inset: 0;
      background: white;
      opacity: 0;
      z-index: 1000;
      pointer-events: none;
    }

    .shake {
      animation: shake 0.12s infinite;
    }

    @keyframes shake {
      0%   { transform: translate(0, 0); }
      20%  { transform: translate(-15px, 8px); }
      40%  { transform: translate(12px, -10px); }
      60%  { transform: translate(-8px, -12px); }
      80%  { transform: translate(10px, 7px); }
      100% { transform: translate(0, 0); }
    }

    @keyframes flash {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }
  </style>
</head>

<body>

  <div id="screen">
    <div id="warning">loading...</div>
  </div>

  <div id="jumpscare">
    <!-- Jumpscare görseli -->
    <svg id="face" viewBox="0 0 1000 1000"
         xmlns="http://www.w3.org/2000/svg">

      <rect width="1000" height="1000" fill="#050505"/>

      <!-- kafa -->
      <ellipse cx="500" cy="500" rx="330" ry="390"
               fill="#d8d8d8"/>

      <!-- göz çevreleri -->
      <ellipse cx="365" cy="430" rx="105" ry="125"
               fill="#050505"/>
      <ellipse cx="635" cy="430" rx="105" ry="125"
               fill="#050505"/>

      <!-- gözler -->
      <ellipse cx="365" cy="440" rx="32" ry="45"
               fill="white"/>
      <ellipse cx="635" cy="440" rx="32" ry="45"
               fill="white"/>

      <!-- burun -->
      <path d="M470 450 L430 650 L570 650 L530 450"
            fill="#333"/>

      <!-- ağız -->
      <path d="M300 700 Q500 850 700 700
               Q650 900 500 920
               Q350 900 300 700Z"
            fill="#050505"/>

      <!-- dişler -->
      <path d="
        M330 735 L375 755 L420 765 L465 770
        L510 772 L555 765 L600 755 L650 735
        L635 790 L590 800 L545 805 L500 808
        L455 805 L410 800 L365 790 Z"
        fill="white"/>

      <!-- çatlaklar -->
      <path d="M260 250 L190 170 L230 330"
            stroke="#555" stroke-width="12" fill="none"/>
      <path d="M740 250 L810 170 L770 330"
            stroke="#555" stroke-width="12" fill="none"/>

    </svg>
  </div>

  <div id="flash"></div>

  <!-- SENİN SES DOSYAN -->
  <audio id="scream" preload="auto">
    <source src="dragon-studio-nuclear-explosion-386181.mp3" type="audio/mpeg">
  </audio>

  <script>
    const screen = document.getElementById("screen");
    const jumpscare = document.getElementById("jumpscare");
    const face = document.getElementById("face");
    const flash = document.getElementById("flash");
    const scream = document.getElementById("scream");

    let activated = false;

    function jump() {
      if (activated) return;
      activated = true;

      // Siyah ekran
      screen.style.display = "none";

      // Jumpscare
      jumpscare.style.display = "flex";
      jumpscare.classList.add("shake");

      // Beyaz flaş
      flash.style.animation = "flash 0.18s forwards";

      // Ses
      scream.currentTime = 0;
      scream.play().catch(() => {});

      // Birkaç saniye sonra sakinleşsin
      setTimeout(() => {
        jumpscare.classList.remove("shake");
      }, 900);
    }

    /*
      Sayfaya girdikten sonra rastgele bir süre bekler.
      4-9 saniye arasında jumpscare gelir.
    */
    const delay = 4000 + Math.random() * 5000;

    setTimeout(jump, delay);

    /*
      Ekrana tıklarsan da hemen çalışır.
      Bu, tarayıcının ses engelini aşmasına yardımcı olur.
    */
    document.addEventListener("click", () => {
      if (!activated) {
        jump();
      }
    });
  </script>

</body>
</html>
